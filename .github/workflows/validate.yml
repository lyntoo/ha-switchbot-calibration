name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Custom repository: not submitted to the HACS default store, so the brand-assets check does not apply.
          ignore: brands
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "PySwitchbot==2.9.0"
      - run: python tests/test_calibration.py
